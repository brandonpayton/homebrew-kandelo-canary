name: Publish Kandelo bottles

on:
  repository_dispatch:
    types: [publish-kandelo-bottles]

jobs:
  publish:
    permissions:
      actions: read
      contents: write
      packages: write
    uses: Automattic/kandelo/.github/workflows/reusable-homebrew-bottle-publish.yml@89c18589c848f3f3e017080a3ea8ba5cf68d105f
    with:
      kandelo-repository: Automattic/kandelo
      # WHY: publication authority and package generation are admitted
      # together on Kandelo main. Pinning both inputs prevents a later mutable
      # ref from changing either the publisher or its package closure.
      kandelo-ref: 89c18589c848f3f3e017080a3ea8ba5cf68d105f
      tap-repository: brandonpayton/homebrew-kandelo-canary
      tap-name: brandonpayton/kandelo-canary
      # WHY: repository_dispatch loads this caller from main, but Formula
      # source must remain the exact reviewed snapshot selected for the proof.
      tap-ref: ${{ github.event.client_payload.tap_sha }}
      formulae: ${{ github.event.client_payload.formulae }}
      arches: ${{ github.event.client_payload.arches || 'wasm32' }}
      release-tag: ${{ github.event.client_payload.release_tag || '' }}
      expected-cache-keys: ${{ github.event.client_payload.expected_cache_keys || '' }}
      force: ${{ github.event.client_payload.force || false }}
      dry-run: false
      require-vfs-acceptance: ${{ github.event.client_payload.require_vfs_acceptance || false }}
      # WHY: this content-addressed, main-admitted generation is the immutable
      # package input for the bounded wasm32 rootfs lane. The retired PR #1079
      # staging release is no longer publication authority.
      package-generation-wasm32: package-generation-rootfs-wasm32-abi-v42-sha256-cd3d3f37ae1a4451aabf906b9eaf523ca611ad9492fbb03d7e666dcb9e1ee5a4
